services:

  # ================================================================================================
  # PHP-FPM Laravel
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: altertemplate_backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    command: sh -c "composer install --no-interaction --prefer-dist && php-fpm"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: altertemplate
      DB_USERNAME: postgres
      DB_PASSWORD: root
      DB_SSLMODE: prefer
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    networks:
      - template_services_template_network

  # ================================================================================================
  # Nginx Laravel
  nginx_backend:
    image: nginx:stable-alpine
    container_name: altertemplate_nginx_backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www
      - ./nginx/backend.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - template_services_template_network

  # ================================================================================================
  # React + Vite development server
  frontend:
    image: node:20-alpine
    container_name: altertemplate_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - template_services_template_network

  # ================================================================================================
  # Laravel queue worker
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: altertemplate_queue
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    command: sh -c "composer install --no-interaction --prefer-dist && php artisan queue:work --sleep=3 --tries=3"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: altertemplate
      DB_USERNAME: postgres
      DB_PASSWORD: root
      DB_SSLMODE: prefer
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    depends_on:
      - backend
    networks:
      - template_services_template_network

networks:
  template_services_template_network:
    external: true
